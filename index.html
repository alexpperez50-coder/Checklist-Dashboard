<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Care+ Checklist Compliance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg:#EFF3F2;
    --surface:#FFFFFF;
    --surface-alt:#F6F8F7;
    --primary:#1E6B74;
    --primary-dark:#133F45;
    --ink:#202526;
    --ink-muted:#5B6669;
    --border:#DCE3E1;
    --good:#3F8F5F;
    --good-bg:#E7F2EA;
    --warn:#D9642C;
    --warn-bg:#FBEAE0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:32px 20px 60px;
  }

  .wrap{max-width:1080px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
    border-bottom:2px solid var(--primary-dark);
    padding-bottom:18px;
    margin-bottom:18px;
  }
  header .brand{
    font-family:'Libre Franklin', sans-serif;
    font-weight:900;
    font-size:14px;
    letter-spacing:0.06em;
    color:var(--primary-dark);
    margin-bottom:6px;
  }
  header h1{
    font-family:'Libre Franklin', sans-serif;
    font-weight:800;
    font-size:30px;
    margin:0;
    color:var(--ink);
    line-height:1.15;
  }
  header .locations{
    font-size:14px;
    color:var(--ink-muted);
    text-align:right;
  }

  /* Filter bar */
  .filterbar{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    background:var(--surface);
    border:1px solid var(--border);
    padding:12px 16px;
    margin-bottom:20px;
  }
  .seg{display:flex;border:1px solid var(--border);}
  .seg button{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:7px 14px;
    background:var(--surface);
    border:none;
    color:var(--ink-muted);
    cursor:pointer;
  }
  .seg button + button{border-left:1px solid var(--border);}
  .seg button.active{background:var(--primary);color:#fff;}
  select#periodSelect{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:7px 10px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    min-width:220px;
  }
  .filterbar .hint{font-size:12px;color:var(--ink-muted);}
  .refresh-block{display:flex;align-items:center;gap:10px;margin-left:auto;}
  #lastRefreshed{font-size:12px;color:var(--ink-muted);}
  #refreshBtn{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:6px 12px;
    background:var(--surface);
    border:1px solid var(--primary);
    color:var(--primary);
    cursor:pointer;
  }
  #refreshBtn:hover{background:var(--primary);color:#fff;}
  .refresh-msg{
    flex-basis:100%;
    font-size:12.5px;
    color:var(--primary-dark);
    background:var(--surface-alt);
    border:1px solid var(--border);
    padding:8px 12px;
    display:none;
  }
  .refresh-msg.show{display:block;}

  /* KPI row */
  .kpis{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:20px;
  }
  .kpi{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--primary);
    padding:16px 18px;
  }
  .kpi.alert{border-left-color:var(--warn);}
  .kpi .num{
    font-family:'Libre Franklin', sans-serif;
    font-weight:800;
    font-size:30px;
    color:var(--ink);
    line-height:1;
  }
  .kpi.alert .num{color:var(--warn);}
  .kpi .label{
    margin-top:6px;
    font-size:12.5px;
    color:var(--ink-muted);
  }

  /* Flag banner */
  .flag{
    background:var(--warn-bg);
    border:1px solid #EFC5A6;
    border-left:4px solid var(--warn);
    padding:16px 18px;
    margin-bottom:24px;
  }
  .flag .flag-head{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Libre Franklin', sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--warn);
    margin-bottom:10px;
  }
  .flag .flag-entry{margin-bottom:10px;}
  .flag .flag-entry:last-child{margin-bottom:0;}
  .flag .flag-meta{
    font-size:13.5px;
    color:var(--ink-muted);
    margin-bottom:3px;
  }
  .flag .flag-meta b{color:var(--ink);font-weight:600;}
  .flag p{margin:0;font-size:14px;line-height:1.5;color:var(--ink);}

  .no-flag{
    background:var(--good-bg);
    border:1px solid #BFDFC9;
    border-left:4px solid var(--good);
    padding:14px 18px;
    margin-bottom:24px;
    font-size:14px;
    color:var(--ink);
  }
  .no-flag b{color:var(--good);}

  section{margin-bottom:28px;}
  h2{
    font-family:'Libre Franklin', sans-serif;
    font-weight:700;
    font-size:16px;
    margin:0 0 12px;
    color:var(--ink);
  }
  .empty-note{
    background:var(--surface);
    border:1px dashed var(--border);
    padding:16px 18px;
    font-size:13.5px;
    color:var(--ink-muted);
  }

  /* Clinic bars */
  .clinic-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .clinic-card{
    background:var(--surface);
    border:1px solid var(--border);
    padding:16px 18px;
  }
  .clinic-card .clinic-name{
    font-family:'Libre Franklin', sans-serif;
    font-weight:700;
    font-size:15px;
    margin-bottom:10px;
  }
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-row .bar-label{width:64px;font-size:12px;color:var(--ink-muted);flex-shrink:0;}
  .bar-track{flex:1;height:10px;background:var(--surface-alt);border:1px solid var(--border);overflow:hidden;}
  .bar-fill{height:100%;background:var(--primary);}
  .bar-fill.low{background:var(--warn);}
  .bar-pct{width:56px;text-align:right;font-size:12.5px;font-weight:600;color:var(--ink);flex-shrink:0;}

  /* Item audit lists */
  .audit-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .audit-card{
    background:var(--surface);
    border:1px solid var(--border);
    padding:16px 18px;
  }
  .audit-card .audit-title{
    font-family:'Libre Franklin', sans-serif;
    font-weight:700;
    font-size:15px;
    margin-bottom:12px;
  }
  .audit-item{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .audit-item:last-child{margin-bottom:0;}
  .audit-item .item-name{flex:1;font-size:13px;color:var(--ink);}
  .audit-item .item-track{width:110px;height:8px;background:var(--surface-alt);border:1px solid var(--border);overflow:hidden;flex-shrink:0;}
  .audit-item .item-fill{height:100%;background:var(--good);}
  .audit-item .item-fill.low{background:var(--warn);}
  .audit-item .item-pct{width:38px;text-align:right;font-size:12px;font-weight:600;color:var(--ink-muted);flex-shrink:0;}

  /* Table */
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);}
  thead th{
    text-align:left;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:11.5px;
    letter-spacing:0.02em;
    color:var(--ink-muted);
    background:var(--surface-alt);
    padding:9px 12px;
    border-bottom:1px solid var(--border);
  }
  tbody td{
    padding:9px 12px;
    font-size:13px;
    border-bottom:1px solid var(--border);
    color:var(--ink);
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.flagged{background:var(--warn-bg);}
  .pill{
    display:inline-block;
    padding:2px 8px;
    font-size:11.5px;
    font-weight:600;
    border-radius:2px;
  }
  .pill.good{background:var(--good-bg);color:var(--good);}
  .pill.bad{background:var(--warn-bg);color:var(--warn);}
  .type-tag{font-size:12px;color:var(--ink-muted);}

  footer{
    margin-top:28px;
    font-size:12px;
    color:var(--ink-muted);
    border-top:1px solid var(--border);
    padding-top:14px;
  }

  @media (max-width:720px){
    .kpis{grid-template-columns:1fr 1fr;}
    .clinic-grid, .audit-grid{grid-template-columns:1fr;}
    header{flex-direction:column;align-items:flex-start;}
    header .locations{text-align:left;}
    table{font-size:12px;}
    .filterbar .hint{margin-left:0;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand">CARE+ PEDIATRICS URGENT CARE</div>
      <h1>Daily Checklist Compliance</h1>
    </div>
    <div class="locations">NW OKC · South OKC · Edmond</div>
  </header>

  <div class="filterbar">
    <div class="seg" id="modeSeg">
      <button data-mode="week" class="active">Weekly</button>
      <button data-mode="month">Month to date</button>
    </div>
    <select id="periodSelect"></select>
    <div class="hint" id="periodHint"></div>
    <div class="refresh-block">
      <span id="lastRefreshed"></span>
      <button id="refreshBtn" type="button">↻ Refresh</button>
    </div>
    <div id="refreshMsg" class="refresh-msg"></div>
  </div>

  <section class="kpis" id="kpiSection"></section>

  <div id="flagSection"></div>

  <section>
    <h2>Completion by clinic</h2>
    <div class="clinic-grid" id="clinicSection"></div>
  </section>

  <section>
    <h2>Steps most often skipped</h2>
    <div class="audit-grid" id="auditSection"></div>
  </section>

  <section>
    <h2 id="tableTitle">All submissions</h2>
    <table>
      <thead>
        <tr><th>Date &amp; time</th><th>Clinic</th><th>Checklist</th><th>Staff</th><th>Steps complete</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </section>

  <footer id="footerNote"></footer>

</div>

<script>
// ---------- Config ----------
const OPENING_ITEMS = ["Turn on All Lights and Signage","Unlock Door(s)","Turn on TV(s)","Open Blinds/Shades","Turn on Music","Check Cleanliness of Lobby/Coffee","Turn On X-Ray","Squeegee Front Parking (Edmond Only)"];
const CLOSING_ITEMS = ["Supplies Received & Put Away","Lab Specimens to LockBox","Test Kits & Cleaning Supplies Put Away","Medications Put Away","Computer/Teams Logged Off","Exam Rooms Cleaned & Stocked","X-Ray Board Cleaned & Off","Countertops Cleared & Cleaned","Coffee Station Checklist","DLO Called (South Only)"];
const CLINICS = ["NW OKC","Edmond","South"];
const FLAG_THRESHOLD = 75;

// Data is loaded from data.json (kept current by the Power Automate flow) rather than baked in here.
let openingRecords = [];
let closingRecords = [];
let TODAY = null;
let todayDate, currentWeekKey, currentMonthKey;

// ---------- Date helpers ----------
function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtShort(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function getMonday(d){ const date=new Date(d); const day=date.getDay(); const diff=(day===0?-6:1-day); date.setDate(date.getDate()+diff); return date; }
function weekKey(dateStr){ return getMonday(parseDate(dateStr)).toISOString().slice(0,10); }
function weekLabel(mondayKey){
  const mon=parseDate(mondayKey); const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const sameMonth = mon.getMonth()===sun.getMonth();
  const label = sameMonth
    ? `${fmtShort(mon)} – ${sun.getDate()}, ${sun.getFullYear()}`
    : `${fmtShort(mon)} – ${fmtShort(sun)}, ${sun.getFullYear()}`;
  return `Week of ${label}`;
}
function monthKey(dateStr){ const d=parseDate(dateStr); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function monthLabel(key){ const [y,m]=key.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); }

// ---------- Stat computation ----------
function computeSet(records, itemNames, typeLabel){
  const rows = records.map(r=>{
    let completed=0, total=0, missed=[];
    r.vals.forEach((v,i)=>{ if(v!=="N/A"){ total++; if(v==="Yes") completed++; else missed.push(itemNames[i]); } });
    const pct = total? Math.round((completed/total)*1000)/10 : null;
    return {...r, completed, total, pct, missed, type:typeLabel};
  });
  const totalCompleted = rows.reduce((a,r)=>a+r.completed,0);
  const totalApplicable = rows.reduce((a,r)=>a+r.total,0);
  const overallPct = totalApplicable? Math.round((totalCompleted/totalApplicable)*1000)/10 : null;

  const byClinic = {};
  CLINICS.forEach(c=>{
    const crows = rows.filter(r=>r.clinic===c);
    const comp = crows.reduce((a,r)=>a+r.completed,0);
    const tot = crows.reduce((a,r)=>a+r.total,0);
    byClinic[c] = tot? Math.round((comp/tot)*1000)/10 : null;
  });

  const byItem = itemNames.map((name,i)=>{
    let c=0,t=0;
    rows.forEach(r=>{ const v=r.vals[i]; if(v!=="N/A"){ t++; if(v==="Yes") c++; } });
    return {name, pct: t? Math.round((c/t)*1000)/10 : null, total:t};
  }).filter(it=>it.total>0).sort((a,b)=>a.pct-b.pct);

  const flagged = rows.filter(r=>r.pct!==null && r.pct<FLAG_THRESHOLD).sort((a,b)=>a.pct-b.pct);

  return {rows, count:rows.length, overallPct, byClinic, byItem, flagged};
}

function filterByPeriod(records, mode, periodKey){
  return records.filter(r => mode==='week' ? weekKey(r.date)===periodKey : monthKey(r.date)===periodKey);
}

// ---------- Rendering ----------
function barClass(pct){ return pct!==null && pct<FLAG_THRESHOLD ? 'low' : ''; }
function pctText(pct){ return pct===null ? '—' : pct+'%'; }

function render(mode, periodKey){
  const openRecs = filterByPeriod(openingRecords, mode, periodKey);
  const closeRecs = filterByPeriod(closingRecords, mode, periodKey);
  const open = computeSet(openRecs, OPENING_ITEMS, 'Opening');
  const close = computeSet(closeRecs, CLOSING_ITEMS, 'Closing');

  const totalSubs = open.count + close.count;
  const flaggedCount = open.flagged.length + close.flagged.length;

  // KPIs
  document.getElementById('kpiSection').innerHTML = `
    <div class="kpi"><div class="num">${totalSubs}</div><div class="label">Total submissions this period</div></div>
    <div class="kpi ${open.overallPct!==null && open.overallPct<FLAG_THRESHOLD?'alert':''}"><div class="num">${pctText(open.overallPct)}</div><div class="label">Opening checklist completion</div></div>
    <div class="kpi ${close.overallPct!==null && close.overallPct<FLAG_THRESHOLD?'alert':''}"><div class="num">${pctText(close.overallPct)}</div><div class="label">Closing checklist completion</div></div>
    <div class="kpi ${flaggedCount>0?'alert':''}"><div class="num">${flaggedCount}</div><div class="label">Submission${flaggedCount===1?'':'s'} needing follow-up</div></div>
  `;

  // Flag section
  const allFlagged = [...open.flagged, ...close.flagged].sort((a,b)=>a.pct-b.pct);
  if(allFlagged.length===0){
    document.getElementById('flagSection').innerHTML = totalSubs>0
      ? `<div class="no-flag"><b>No submissions below ${FLAG_THRESHOLD}% this period.</b> Everything on track.</div>`
      : `<div class="empty-note">No submissions recorded for this period yet.</div>`;
  } else {
    document.getElementById('flagSection').innerHTML = `<div class="flag">
      <div class="flag-head">⚠ NEEDS FOLLOW-UP</div>
      ${allFlagged.map(r=>`
        <div class="flag-entry">
          <div class="flag-meta"><b>${r.clinic}</b> · ${r.type} checklist · ${fmtShort(parseDate(r.date))}, ${r.time} · Submitted by <b>${r.staff}</b></div>
          <p>${r.completed} of ${r.total} steps completed. Missed: ${r.missed.join(', ')}.</p>
        </div>`).join('')}
    </div>`;
  }

  // Clinic bars
  function clinicCard(title, byClinic){
    const rowsHtml = CLINICS.map(c=>{
      const pct = byClinic[c];
      return `<div class="bar-row">
        <div class="bar-label">${c}</div>
        <div class="bar-track">${pct===null?'':`<div class="bar-fill ${barClass(pct)}" style="width:${pct}%"></div>`}</div>
        <div class="bar-pct">${pctText(pct)}</div>
      </div>`;
    }).join('');
    return `<div class="clinic-card"><div class="clinic-name">${title}</div>${rowsHtml}</div>`;
  }
  document.getElementById('clinicSection').innerHTML = totalSubs>0
    ? clinicCard('Opening checklist', open.byClinic) + clinicCard('Closing checklist', close.byClinic)
    : '';
  if(totalSubs===0) document.getElementById('clinicSection').innerHTML = `<div class="empty-note">No data for this period yet.</div>`;

  // Item audit
  function auditCard(title, items){
    if(items.length===0) return `<div class="audit-card"><div class="audit-title">${title}</div><div style="font-size:13px;color:var(--ink-muted);">No data for this period yet.</div></div>`;
    return `<div class="audit-card"><div class="audit-title">${title}</div>${items.map(it=>`
      <div class="audit-item">
        <div class="item-name">${it.name}</div>
        <div class="item-track"><div class="item-fill ${barClass(it.pct)}" style="width:${it.pct}%"></div></div>
        <div class="item-pct">${it.pct}%</div>
      </div>`).join('')}</div>`;
  }
  document.getElementById('auditSection').innerHTML = auditCard('Opening steps', open.byItem) + auditCard('Closing steps', close.byItem);

  // Table
  const allRows = [...open.rows, ...close.rows].sort((a,b)=>{
    const da = new Date(a.date+' '+a.time), db = new Date(b.date+' '+b.time);
    return db-da;
  });
  document.getElementById('tableTitle').textContent = `All submissions (${allRows.length})`;
  document.getElementById('tableBody').innerHTML = allRows.length ? allRows.map(r=>`
    <tr class="${r.pct!==null && r.pct<FLAG_THRESHOLD?'flagged':''}">
      <td>${fmtShort(parseDate(r.date))}, ${r.time}</td>
      <td>${r.clinic}</td>
      <td class="type-tag">${r.type}</td>
      <td>${r.staff}</td>
      <td><span class="pill ${r.pct!==null && r.pct<FLAG_THRESHOLD?'bad':'good'}">${r.completed}/${r.total} · ${pctText(r.pct)}</span></td>
    </tr>`).join('') : `<tr><td colspan="5" style="color:var(--ink-muted);">No submissions for this period.</td></tr>`;

  // Footer / hint
  const hint = mode==='week'
    ? (periodKey===currentWeekKey ? 'Current week, in progress' : '')
    : (periodKey===currentMonthKey ? 'Month to date, in progress' : '');
  document.getElementById('periodHint').textContent = hint;
}

// ---------- Period list population ----------
function uniqueSorted(keys){ return [...new Set(keys)].sort().reverse(); }

function populatePeriods(mode){
  const select = document.getElementById('periodSelect');
  const allRecords = [...openingRecords, ...closingRecords];
  let keys, labelFn;
  if(mode==='week'){
    keys = uniqueSorted(allRecords.map(r=>weekKey(r.date)));
    labelFn = weekLabel;
  } else {
    keys = uniqueSorted(allRecords.map(r=>monthKey(r.date)));
    labelFn = monthLabel;
  }
  select.innerHTML = keys.map(k=>`<option value="${k}">${labelFn(k)}</option>`).join('');
  if(keys.length){
    select.value = keys[0];
    render(mode, keys[0]);
  }
}

async function loadData(isManualRefresh){
  const msg = document.getElementById('refreshMsg');
  try{
    const res = await fetch('https://carepluspediatrics-my.sharepoint.com/:u:/p/alex/IQD9Xg2KSE0STq7Ln6A9jYFRAa-YfcEzbsz0p6fF3gRHUu4?e=aN4yvq&download=1', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();

    openingRecords = data.opening || [];
    closingRecords = data.closing || [];
    TODAY = data.generatedAt.slice(0,10);
    todayDate = parseDate(TODAY);
    currentWeekKey = weekKey(TODAY);
    currentMonthKey = monthKey(TODAY);

    const genDate = new Date(data.generatedAt);
    document.getElementById('lastRefreshed').textContent = 'Last refreshed: ' + genDate.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ', ' + genDate.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    document.getElementById('footerNote').textContent = "Fed automatically from \"Daily Opening Checklist.xlsx\" and \"Daily Closing Checklist.xlsx\" via a scheduled Power Automate flow. As more weeks/months come in, they'll appear in the dropdown above.";

    const activeMode = document.querySelector('#modeSeg button.active')?.dataset.mode || 'week';
    populatePeriods(activeMode);

    if(isManualRefresh){
      msg.textContent = 'Up to date as of ' + document.getElementById('lastRefreshed').textContent.replace('Last refreshed: ','') + '.';
      msg.classList.add('show');
    }
  } catch(err){
    msg.textContent = "Couldn't load data.json — check that the file exists in this site and that the Power Automate flow has run at least once. (" + err.message + ")";
    msg.classList.add('show');
  }
}

document.getElementById('modeSeg').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  populatePeriods(btn.dataset.mode);
});
document.getElementById('periodSelect').addEventListener('change', (e)=>{
  const mode = document.querySelector('#modeSeg button.active').dataset.mode;
  render(mode, e.target.value);
});
document.getElementById('refreshBtn').addEventListener('click', ()=>loadData(true));

loadData(false);
</script>
</body>
</html>
